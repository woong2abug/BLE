<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Bluetooth 기초 예제</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        button { padding: 10px 15px; margin: 5px; font-size: 14px; cursor: pointer; }
        #log { background: #f4f4f4; padding: 10px; border-radius: 5px; height: 200px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>

    <h2>Web Bluetooth BLE 연결 및 통신</h2>
    
    <div>
        <button id="btnConnect">1. BLE 기기 검색 및 연결</button>
        <button id="btnDisconnect" disabled>연결 해제</button>
    </div>
    
    <div style="margin-top: 15px;">
        <button id="btnRead" disabled>2. 데이터 읽기 (Read)</button>
        <button id="btnWrite" disabled>3. 데이터 쓰기 (Write)</button>
    </div>

    <h3>로그 출력:</h3>
    <div id="log"></div>

    <script>
        // Target GATT Service & Characteristic UUID 설정
        // 테스트용 Custom UUID 또는 SIG Standard UUID 입력
        const SERVICE_UUID = '0000180f-0000-1000-8000-00805f9b34fb'; // 예: 배터리 서비스 (Battery Service)
        const CHARACTERISTIC_UUID = '00002a19-0000-1000-8000-00805f9b34fb'; // 예: 배터리 잔량 (Battery Level)

        let bluetoothDevice = null;
        let gattServer = null;
        let targetCharacteristic = null;

        const logElem = document.getElementById('log');
        function log(msg) {
            logElem.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logElem.scrollTop = logElem.scrollHeight;
        }

        // 1. BLE 기기 검색 및 연결
        document.getElementById('btnConnect').addEventListener('click', async () => {
            if (!navigator.bluetooth) {
                log('❌ 이 브라우저는 Web Bluetooth를 지원하지 않습니다.');
                return;
            }

            try {
                log('🔍 BLE 기기 스캔 시작...');
                
                // 디바이스 스캔 (보안 팝업 출력)
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    // 특정 이름 prefix로 필터링 시 사용:
                    // filters: [{ namePrefix: 'MYCOMPANY_' }],
                    
                    // 스캔할 서비스 UUID 지정 (필수)
                    filters: [{ services: [SERVICE_UUID] }],
                    
                    // 모든 장치를 스캔하고 싶을 경우 (optionalServices 필수 지정):
                    // acceptAllDevices: true,
                    // optionalServices: [SERVICE_UUID]
                });

                log(`✅ 기기 선택됨: ${bluetoothDevice.name || '알 수 없는 기기'} (${bluetoothDevice.id})`);

                // 연결 해제 이벤트 리스너 등록
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                // GATT 서버 연결
                log('🔌 GATT 서버에 연결 중...');
                gattServer = await bluetoothDevice.gatt.connect();

                // 서비스 가져오기
                log('📡 Primary Service 요청 중...');
                const service = await gattServer.getPrimaryService(SERVICE_UUID);

                // Characteristic 가져오기
                log('📝 Characteristic 요청 중...');
                targetCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                log('🎉 성공적으로 연결되었습니다! 데이터를 주고받을 준비가 되었습니다.');
                
                // UI 버튼 상태 업데이트
                updateUI(true);

            } catch (error) {
                log(`❌ 연결 실패 또는 취소됨: ${error.message}`);
            }
        });

        // 2. 데이터 읽기 (Read Characteristic)
        document.getElementById('btnRead').addEventListener('click', async () => {
            if (!targetCharacteristic) return;

            try {
                log('📖 데이터 읽기 요청 중...');
                const dataView = await targetCharacteristic.readValue();
                
                // DataView 형태의 바이너리 데이터를 배열/문자열로 변환
                const rawData = new Uint8Array(dataView.buffer);
                log(`📥 수신된 Raw Data (Hex): ${Array.from(rawData).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}`);
                
                // 예: 배터리 수치(1바이트 정수)로 해석할 경우
                if (rawData.length > 0) {
                    log(`📥 해석된 값 (Decimal): ${rawData[0]}`);
                }
            } catch (error) {
                log(`❌ 데이터 읽기 실패: ${error.message}`);
            }
        });

        // 3. 데이터 쓰기 (Write Characteristic)
        document.getElementById('btnWrite').addEventListener('click', async () => {
            if (!targetCharacteristic) return;

            try {
                // 송신할 바이너리 데이터 준비 (예: [0x01, 0xFF, 0x0A])
                const sendData = new Uint8Array([0x01, 0xFF, 0x0A]);
                
                log(`📤 데이터 전송 중: ${Array.from(sendData).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}`);
                
                // Write Without Response 사용 시: writeValueWithoutResponse()
                await targetCharacteristic.writeValueWithResponse(sendData);
                log('✅ 데이터 전송 성공!');
            } catch (error) {
                log(`❌ 데이터 전송 실패: ${error.message}`);
            }
        });

        // 4. 연결 해제
        document.getElementById('btnDisconnect').addEventListener('click', () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        });

        function onDisconnected() {
            log('🔌 기기와의 연결이 해제되었습니다.');
            updateUI(false);
        }

        function updateUI(connected) {
            document.getElementById('btnConnect').disabled = connected;
            document.getElementById('btnDisconnect').disabled = !connected;
            document.getElementById('btnRead').disabled = !connected;
            document.getElementById('btnWrite').disabled = !connected;
        }
    </script>
</body>
</html>
