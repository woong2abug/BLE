<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Bluetooth BLE 연동 테스트</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; line-height: 1.6; max-width: 600px; margin: 0 auto; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: 1px solid #ccc; border-radius: 6px; background-color: #f8f9fa; cursor: pointer; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #log { background: #f1f3f5; padding: 12px; border-radius: 6px; height: 260px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 12px; border: 1px solid #dee2e6; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Web Bluetooth BLE 연결 및 통신</h2>
    
    <div class="btn-group">
        <button id="btnConnect">1. BLE 기기 검색 및 연결</button>
        <button id="btnDisconnect" disabled>연결 해제</button>
    </div>
    
    <div class="btn-group">
        <button id="btnRead" disabled>2. 데이터 읽기 (Read)</button>
        <button id="btnWrite" disabled>3. 데이터 쓰기 (Write)</button>
    </div>

    <h3>로그 출력:</h3>
    <div id="log"></div>

    <script>
        // 타겟 기기의 Service & Characteristic UUID 설정 (확인된 UUID로 변경 가능)
        let SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb'; 
        let CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb'; 

        let bluetoothDevice = null;
        let gattServer = null;
        let targetCharacteristic = null;

        const logElem = document.getElementById('log');
        function log(msg) {
            logElem.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logElem.scrollTop = logElem.scrollHeight;
        }

        // 1. BLE 기기 검색 및 연결
        document.getElementById('btnConnect').addEventListener('click', async () => {
            if (!navigator.bluetooth) {
                log('❌ 이 브라우저는 Web Bluetooth를 지원하지 않습니다.');
                return;
            }

            try {
                log('🔍 주변 BLE 기기 스캔 시작...');
                
                // 필터 없이 주변 모든 BLE 기기 스캔
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    // 통신에 사용 가능한 대표적인 16bit 표준 및 커스텀 서비스 UUID 미리 허용
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb', // 일반 커스텀 시리얼 서비스
                        '0000fff0-0000-1000-8000-00805f9b34fb', 
                        '0000180f-0000-1000-8000-00805f9b34fb', // Battery
                        '0000180a-0000-1000-8000-00805f9b34fb', // Device Info
                        SERVICE_UUID
                    ]
                });

                log(`✅ 기기 선택됨: ${bluetoothDevice.name || '이름 없음'}`);
                log(`🆔 디바이스 ID: ${bluetoothDevice.id}`);

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                // GATT 서버 연결
                log('🔌 GATT 서버에 연결 중...');
                gattServer = await bluetoothDevice.gatt.connect();

                // 연결된 기기가 가진 모든 Primary Services 스캔
                log('📡 기기 내부 Service(UUID) 탐색 중...');
                const services = await gattServer.getPrimaryServices();
                log(`🎉 성공적으로 연결되었습니다! (발견된 서비스: ${services.length}개)`);

                // 기기에 존재하는 서비스 UUID를 로그에 전부 출력
                for (const service of services) {
                    log(`  👉 Service UUID: ${service.uuid}`);
                }

                // 첫 번째 서비스에서 Characteristic 탐색 시도
                if (services.length > 0) {
                    try {
                        const characteristics = await services[0].getCharacteristics();
                        if (characteristics.length > 0) {
                            targetCharacteristic = characteristics[0];
                            log(`  📝 제어용 Characteristic 설정 완료: ${targetCharacteristic.uuid}`);
                        }
                    } catch (e) {
                        log(`ℹ️ 특성(Characteristic) 자동 할당을 넘어가고 서비스 확인만 완료했습니다.`);
                    }
                }

                updateUI(true);

            } catch (error) {
                log(`❌ 연결 실패 또는 취소됨: ${error.message}`);
            }
        });

        // 2. 데이터 읽기
        document.getElementById('btnRead').addEventListener('click', async () => {
            if (!targetCharacteristic) {
                log('❌ 데이터 읽기를 지원하는 Characteristic이 설정되지 않았습니다.');
                return;
            }

            try {
                log('📖 데이터 읽기 요청 중...');
                const dataView = await targetCharacteristic.readValue();
                const rawData = new Uint8Array(dataView.buffer);
                log(`📥 수신 (Hex): ${Array.from(rawData).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}`);
            } catch (error) {
                log(`❌ 데이터 읽기 실패: ${error.message}`);
            }
        });

        // 3. 데이터 쓰기
        document.getElementById('btnWrite').addEventListener('click', async () => {
            if (!targetCharacteristic) {
                log('❌ 데이터 쓰기를 지원하는 Characteristic이 설정되지 않았습니다.');
                return;
            }

            try {
                const sendData = new Uint8Array([0x01, 0xFF, 0x0A]);
                log(`📤 전송 데이터: ${Array.from(sendData).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}`);
                await targetCharacteristic.writeValueWithResponse(sendData);
                log('✅ 데이터 전송 성공!');
            } catch (error) {
                log(`❌ 데이터 전송 실패: ${error.message}`);
            }
        });

        // 4. 연결 해제
        document.getElementById('btnDisconnect').addEventListener('click', () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        });

        function onDisconnected() {
            log('🔌 기기와의 연결이 해제되었습니다.');
            updateUI(false);
        }

        function updateUI(connected) {
            document.getElementById('btnConnect').disabled = connected;
            document.getElementById('btnDisconnect').disabled = !connected;
            document.getElementById('btnRead').disabled = !connected;
            document.getElementById('btnWrite').disabled = !connected;
        }
    </script>
</body>
</html>
